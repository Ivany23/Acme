spring.application.name=sistema-acme

# Le um ficheiro .env local (nao vai para o Git). Em producao usam-se variaveis de ambiente.
spring.config.import=optional:file:.env[.properties]

server.port=${PORT:8080}

# Base de dados (Neon PostgreSQL)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.keepalive-time=60000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Regras de negocio
acme.percentagem-organizacao=${PERCENTAGEM_ORGANIZACAO:20}
acme.cors.origens=${CORS_ORIGINS:http://localhost:5173,https://*.vercel.app}
acme.dados-iniciais=${DADOS_INICIAIS:true}

# Login
acme.auth.segredo=${AUTH_SEGREDO:}
acme.auth.validade-horas=${AUTH_VALIDADE_HORAS:12}
acme.admin.login=${ADMIN_LOGIN:admin}
acme.admin.password=${ADMIN_PASSWORD:acme2026}

management.endpoints.web.exposure.include=health
